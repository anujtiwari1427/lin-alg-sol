<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Linear Algebra Solver — Production-ready educational SaaS for matrices, determinants, vectors, linear equations, and eigenvalues with step-by-step explanations.">
  <meta name="theme-color" content="#0f172a">
  <title>{% block title %}Linear Algebra Solver | Production SaaS{% endblock %}</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts (Inter + Fira Code) loaded inside style.css via @import -->
  <!-- Custom Glassmorphism Styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  {% block extra_css %}{% endblock %}

  <!-- MathJax 3 — configure BEFORE the script loads -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath:  [['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        packages: {'[+]': ['ams']}
      },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'] },
      startup: { typeset: false }     // We call MathJax.typeset() manually after dynamic content
    };
  </script>
</head>
<body>
  <!-- Mobile sidebar overlay (backdrop) -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="app-wrapper">
    <!-- Sidebar navigation -->
    {% include 'components/sidebar.html' %}

    <!-- Main page area -->
    <div class="w-100">
      <!-- Top navigation bar -->
      {% include 'components/navbar.html' %}

      <!-- Page content -->
      <main class="main-content">
        {% block content %}{% endblock %}

        <!-- Shared footer -->
        {% include 'components/footer.html' %}
      </main>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <!-- MathJax 3 (async) -->
  <script id="MathJax-script" async
          src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <!-- Core application JS -->
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>

  {% block extra_js %}{% endblock %}

  <!-- Trigger MathJax typesetting after all scripts have been initialised -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Re-run MathJax after dynamic content might have been injected
      if (window.MathJax && window.MathJax.typeset) {
        window.MathJax.typeset();
      }
    });
  </script>
</body>
</html>
