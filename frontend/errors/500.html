{% extends 'base.html' %}

{% block title %}500 - Internal Error | Linear Algebra Solver{% endblock %}

{% block content %}
<div class="glass-panel p-5 text-center my-5">
  <div class="display-1 fw-bold text-danger mb-3">500</div>
  <h2 class="fw-bold mb-3">Internal Server Exception</h2>
  <p class="text-secondary max-w-md mx-auto mb-4">
    An unexpected error occurred while processing the calculation. Our team has been notified.
  </p>
  <a href="{{ url_for('main.dashboard') }}" class="btn-primary-custom">
    <i class="fas fa-arrow-left me-1"></i> Back to Safety
  </a>
</div>
{% endblock %}
